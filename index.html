<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a73e8" />
    <meta
      name="description"
      content="MyCalendar — Lịch cá nhân PWA: quản lý sự kiện, nhắc nhở, đồng bộ Firebase, hoạt động offline."
    />
    <meta name="keywords" content="lịch, calendar, sự kiện, nhắc nhở, PWA, Việt Nam" />
    <meta name="author" content="MyCalendar" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="MyCalendar — Lịch cá nhân" />
    <meta
      property="og:description"
      content="Quản lý sự kiện, nhắc nhở và đồng bộ đám mây. PWA hỗ trợ offline."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="MyCalendar" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyCalendar — Lịch cá nhân" />
    <meta
      name="twitter:description"
      content="Quản lý sự kiện, nhắc nhở và đồng bộ đám mây."
    />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800;900&family=Patrick+Hand&family=Pacifico&family=Dancing+Script:wght@700&family=Mali:wght@600;700&family=Bungee&display=swap&subset=vietnamese"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="/" />

    <title>MyCalendar — Lịch cá nhân</title>

    <!-- Structured data: WebApplication (static) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MyCalendar",
        "description": "Ứng dụng lịch cá nhân PWA với đồng bộ Firebase",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web, Android",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "VND" },
        "inLanguage": "vi"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
