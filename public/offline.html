<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ec4899" />
  <title>MyCalendar — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #e8f0fe 0%, #f8f9fa 50%, #fff 100%);
      color: #3c4043;
      padding: 24px;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(160deg, #1a1a2e 0%, #202124 100%);
        color: #e8eaed;
      }
      .card { background: #292a2d; border-color: #5f6368; }
      p { color: #9aa0a6; }
    }
    .card {
      max-width: 400px;
      text-align: center;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 4px 24px rgba(60,64,67,.12);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: #ec4899;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    h1 { font-size: 1.35rem; margin-bottom: 12px; font-weight: 700; }
    p { font-size: 0.95rem; line-height: 1.6; color: #5f6368; margin-bottom: 24px; }
    button {
      background: #ec4899;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #1557b0; }
    .hint { margin-top: 16px; font-size: 0.8rem; color: #80868b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📅</div>
    <h1>Bạn đang offline</h1>
    <p>
      Không thể tải ứng dụng MyCalendar. Kiểm tra kết nối mạng và thử lại.
      Dữ liệu đã lưu trên thiết bị sẽ được đồng bộ khi có mạng.
    </p>
    <button type="button" onclick="location.reload()">Thử lại</button>
    <p class="hint">Mở ứng dụng khi đã kết nối internet ít nhất một lần để dùng offline.</p>
  </div>
</body>
</html>
